name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: '已存在的发布 tag（vX.Y.Z 或 vX.Y.Z-beta.N）'
                required: true
                type: string
            publish:
                description: '创建 Release 后立即发布（stable / beta 环境审批）'
                required: false
                default: false
                type: boolean

permissions:
    contents: write

concurrency:
    group: release-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    COREPACK_ENABLE_STRICT: '0'
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
    verify:
        name: 发布校验
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 校验 tag / 版本 / main 归属
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ github.event.inputs.tag || github.ref_name }}"
                  node scripts/release-verify-tag.mjs "$TAG"
                  git fetch origin main
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main

            - name: 门禁与测试
              run: |
                  pnpm run migration:selftest
                  pnpm run migration:check
                  pnpm run lint
                  pnpm run format:check
                  pnpm run typecheck
                  pnpm -F @yami/editor run typecheck:vue
                  pnpm -F @yami/ui-kit run build:types
                  pnpm -F @yami/ui-kit test
                  pnpm -F @yami/editor test

            - name: 构建（验证 UI 产物可生成）
              run: pnpm run build:vite

    build:
        name: 打包（${{ matrix.label }}）
        needs: verify
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      label: win-x64
                      script: build:winexe
                    - os: macos-latest
                      label: mac-x64
                      script: build:macexe
                    - os: macos-latest
                      label: mac-arm64
                      script: build:macArmexe
                    - os: ubuntu-latest
                      label: linux-x64
                      script: build:linuxexe
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            - name: 打包
              run: pnpm -F @yami/editor run ${{ matrix.script }}

            - name: 生成校验和
              run: node scripts/release-checksums.mjs packages/editor/build

            - name: 上传安装包
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.label }}
                  if-no-files-found: error
                  path: |
                      packages/editor/build/*.exe
                      packages/editor/build/*.dmg
                      packages/editor/build/*.zip
                      packages/editor/build/*.AppImage
                      packages/editor/build/*.deb
                      packages/editor/build/*.blockmap
                      packages/editor/build/latest*.yml
                      packages/editor/build/SHA256SUMS.txt

    release:
        name: 创建 Draft Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: 汇总产物
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  pattern: '*'
                  merge-multiple: false

            - name: 扁平化并重命名元数据
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release
                  for dir in artifacts/*; do
                    label="$(basename "$dir")"
                    for file in "$dir"/*; do
                      name="$(basename "$file")"
                      case "$name" in
                        latest-mac.yml) name="latest-mac-${label#mac-}.yml" ;;
                        SHA256SUMS.txt) name="SHA256SUMS-${label}.txt" ;;
                      esac
                      cp "$file" "release/$name"
                    done
                  done
                  cp resources.lock.json release/resources.lock.json
                  ls -lh release

            - name: 生成 Release Notes
              shell: bash
              run: |
                  set -euo pipefail
                  TAG="${{ github.event.inputs.tag || github.ref_name }}"
                  VER="${TAG#v}"
                  node scripts/release-notes.mjs "$VER" > release-notes.md || true

            - name: 创建或更新 Draft Release
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.event.inputs.tag || github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  PRE=""
                  case "$TAG" in *-*) PRE="--prerelease" ;; esac
                  NOTES_ARGS=(--generate-notes)
                  if [ -s release-notes.md ]; then
                    NOTES_ARGS=(--notes-file release-notes.md)
                  fi
                  mapfile -d '' FILES < <(find release -maxdepth 1 -type f -print0)
                  if [ "${#FILES[@]}" -eq 0 ]; then
                    echo "没有可发布的产物" >&2
                    exit 1
                  fi
                  if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                    gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$REPO"
                  else
                    gh release create "$TAG" "${FILES[@]}" \
                      --repo "$REPO" \
                      --title "$TAG" \
                      --draft \
                      ${PRE} \
                      "${NOTES_ARGS[@]}"
                  fi

    publish:
        name: 发布 Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        needs: release
        runs-on: ubuntu-latest
        environment: release-stable
        steps:
            - name: 发布 Draft
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.event.inputs.tag }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  case "$TAG" in
                    *-*) gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease ;;
                    *) gh release edit "$TAG" --repo "$REPO" --draft=false --latest ;;
                  esac
