# 持续集成：把「本地人工纪律」变成「机制」
#
# 背景（2026-09-17）：本仓库此前**没有** .github/，门禁只在本地 git hook 里 —— 而
# `lint-staged.config.js` 只对**暂存文件**跑 `oxfmt` + `oxlint --fix`。`tsc` / `vue-tsc` /
# vitest / `build:vite` / 各体检脚本一次都不在提交路径上。也就是说「全绿」当时是人工纪律的
# 结果，而不是机制的结果。这个 workflow 把它补上。
#
# 设计取舍：
#   1. **不跑 lint-staged**：CI 要看的是全量，不是暂存子集。
#   2. **`migration:check` 是核心**：棘轮门禁，任一迁移轴指标上升就红。
#      它只做纯文本扫描、零子进程，所以比 tsc/test 快得多，且不会因为工具链故障而假绿。
#   3. **`migration:selftest` 先于 `migration:check`**：门禁自身的口径必须先自证
#      （零依赖、零子进程，任何环境都能跑）。
#   4. 三平台矩阵只跑「快」的那批（类型 + lint + 测试口径）；构建与 electron-builder
#      放在单独一个 job，避免每次 PR 都出完整安装包。

name: CI

on:
    push:
        branches: ['**']
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    # 与 package.json 的 packageManager 对齐；pnpm 通过 corepack 激活
    COREPACK_ENABLE_STRICT: '0'

jobs:
    gates:
        name: 门禁（类型 / lint / 迁移台账）
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            # --- 迁移台账：先自证口径，再判定棘轮 ---------------------------------
            - name: 迁移台账自测（门禁自身的口径）
              run: pnpm run migration:selftest

            - name: 迁移台账棘轮（任一轴上升即失败）
              run: pnpm run migration:check

            - name: DOM 迁移矩阵（明细，落盘 scripts/dom-migration-tracker.md）
              run: pnpm run dom:guard:tracker

            # 文档一致性：文档里写的包脚本 / 相对链接 / `node scripts/x` 引用必须真实存在。
            # 2026-09-21 重写前它是「docs/ 不存在 → exit 0」的空门禁；现在的口径与零误报实测
            # 见 scripts/docs-check.mjs 头部。
            - name: 文档一致性（包脚本 / 链接 / 脚本引用）
              run: pnpm run docs:check

            # --- 类型与 lint -------------------------------------------------------
            - name: oxlint（编辑器 + 组件库 + scripts）
              run: pnpm run lint

            # 格式门禁（2026-09-21 补，对应待决策第 ① 项）：此前 `format:check` 有 321 个文件不合格
            # （editor 249 + ui-kit 72）且**不在 CI 里** —— 一个永远红、又没人看的脚本。
            # 存量已用一次 `pnpm format` 收口（305 个文件，独立提交），现在它是一条真门禁。
            # 扫描面与 `lint` 对齐：`packages/editor` + `packages/ui-kit`。
            - name: 格式一致性（oxfmt）
              run: pnpm run format:check

            - name: tsc strict（编辑器）
              run: pnpm run typecheck

            - name: vue-tsc 棘轮（仅拦截新增错误）
              run: pnpm -F @yami/editor run typecheck:vue

            # ui-kit 的 `.vue` 此前**不在任何门禁里**（editor 的 typecheck:vue 只覆盖 packages/editor）
            # ⇒ 它的类型债对 CI 完全不可见。这一条把那个盲区关掉（2026-09-21 补，对应待决策第 ③ 项）。
            # ⚠️ editor 的 `tsc -p tsconfig.strict.json` 对 `.vue` 是**假绿**（第 31/39/48 轮同一个坑
            #    踩过三次），所以 `.vue` 只能靠 vue-tsc 这一类工具量，不能靠 tsc。
            - name: vue-tsc 类型检查（组件库 ui-kit）
              run: pnpm -F @yami/ui-kit run build:types

            # --- 体检脚本 ---------------------------------------------------------
            - name: 全局类型增强审计（global.d.ts 接口块应为 0）
              run: node scripts/global-types-audit.mjs

            - name: 事件面报表（内联匿名监听 / 事件名清单）
              run: pnpm run events:surface

            - name: 陈旧豁免注释（应为 0）
              run: pnpm run stale-exemptions

            # 2026-09-21 补：`tsc` / `oxlint` / `oxfmt` / vitest **全都看不见**的一族写坏 ——
            # 单词首字母被换成控制字符、代码行被吞进 `//` 注释、整段注释被复制进自己。
            # 实测过 4 种形态且全绿通过既有门禁，因此必须单独量（口径与自证见 scripts/lib/text-integrity.mjs）。
            - name: 文本污染（控制字符 / 注释被写坏，应为 0）
              run: pnpm run text:check

    tests:
        name: 测试（editor / ui-kit）
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: ui-kit 测试
              run: pnpm -F @yami/ui-kit test

            - name: editor 测试
              run: pnpm -F @yami/editor test

    build:
        name: 构建（vite）
        runs-on: ubuntu-latest
        # 构建比门禁慢得多；只有门禁与测试都过了才值得跑
        needs: [gates, tests]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: vite 构建（含 ui-kit）
              run: pnpm run build:vite
