		<script>
			window.__nodeRequire = window.require;
			// 启动阶段耗时时间线（见 src/utils/boot-timeline.ts）。
			// 必须内联：外链模块要先下载+解析才能求值，量不到「模块图之前」的耗时。
			window.__BOOT_MARKS__ = [{ name: 'html-head', ms: performance.now() }];
			requestAnimationFrame(function () {
				requestAnimationFrame(function () {
					window.__BOOT_MARKS__.push({ name: 'first-frame', ms: performance.now() });
				});
			});
		</script>
		<title>Yami RPG Editor</title>
		<meta charset="utf-8" content="text/html" />
		<meta name="viewport" content="width=device-width" />

		<!-- 启动加载层。必须内联，且不能依赖 Project/index.css：外链样式表是**阻塞渲染**的，
		     等它解析完才可能画出第一帧，而这一层存在的意义正是抢在那之前先有画面。
		     底色写死 #181818 —— 与暗色主题的 --workspace-background（Project/css/foundation.css）
		     同值。这里刻意不用 design token：token 恰恰就在那份还没解析完的 CSS 里。
		     移除时机见 src/main.ts 的 dismissBootSplash。 -->
		<style>
			html {
				background-color: #181818;
			}

			#yami-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 18px;
				background-color: #181818;
				color: #b0b0b0;
				font-family: Inter, 'Segoe UI', sans-serif;
				/* 无边框窗口在加载期仍要能拖动（覆盖层盖住了 #title-app-region） */
				-webkit-app-region: drag;
			}

			#yami-boot-title {
				font-size: 20px;
				letter-spacing: 1px;
				color: #e0e0e0;
			}

			#yami-boot-bar {
				width: 180px;
				height: 2px;
				overflow: hidden;
				background-color: #303030;
			}

			#yami-boot-bar::after {
				content: '';
				display: block;
				width: 40%;
				height: 100%;
				background-color: #e8a33d;
				animation: yami-boot-slide 1.1s ease-in-out infinite;
			}

			#yami-boot-hint {
				font-size: 12px;
				opacity: 0.6;
			}

			@keyframes yami-boot-slide {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
		</style>

		<link rel="stylesheet" href="Project/index.css" />
